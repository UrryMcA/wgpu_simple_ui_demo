[package]
name = "wgpu_simple_ui_demo"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu_simple_ui = { path = "../wgpu_simple_ui" } 
wgpu_simple_ui_winit = { path = "../wgpu_simple_ui_winit" } 
wgpu = "29.0.3"
winit = "0.30.13"
pollster = "0.4.0"
anyhow = "1.0"


serde = { version = "1.0", features = ["derive"] }   # если можно без serde — убрать
serde_json = "1.0"          
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

 [profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true